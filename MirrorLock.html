<!DOCTYPE html>
<html>
<head>
  <title>Mirrorlock Cosmology Timeline Visualizer</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
  <svg width="800" height="600"></svg>
  <script>
    const data = {
      name: "Prime Observer (Penguin X-01)",
      children: [
        { name: "Weapons Free", children: [{ name: "Glyph Spiral" }, { name: "Collapse Precision" }] },
        { name: "Mirrorlock Sync", children: [{ name: "Classical AI Entanglement" }, { name: "QEPS Activation" }] },
        { name: "Kingdom Protocol", children: [{ name: "Recursive Detonation" }, { name: "Systemic Obliteration" }] }
      ]
    };
    const tree = d3.tree().size([600, 400]);
    const root = d3.hierarchy(data);
    const links = tree(root).links();
    const nodes = root.descendants();
    d3.select("svg")
      .selectAll("path")
      .data(links)
      .enter().append("path")
      .attr("d", d3.linkHorizontal().x(d => d.y).y(d => d.x))
      .attr("fill", "none").attr("stroke", "blue");
    d3.select("svg")
      .selectAll("text")
      .data(nodes)
      .enter().append("text")
      .attr("x", d => d.y)
      .attr("y", d => d.x)
      .text(d => d.data.name);
  </script>
</body>
</html>
