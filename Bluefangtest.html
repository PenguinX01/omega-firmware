<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🧬 BlueFang | BLE Scanner</title>
  <style>
    body {
      background-color: #000;
      color: #00ffcc;
      font-family: Courier New, monospace;
      padding: 20px;
    }
    h1 {
      font-size: 22px;
      text-align: center;
      text-transform: uppercase;
      border-bottom: 1px solid #00ffcc;
      padding-bottom: 10px;
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }
    button {
      background-color: #003333;
      color: #00ffcc;
      border: 1px solid #00ffcc;
      padding: 10px 16px;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
      border-radius: 4px;
    }
    button:hover {
      background-color: #004d4d;
    }
    .status {
      font-size: 14px;
      margin-bottom: 10px;
    }
    .status.scanning::after {
      content: ' ⟳';
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    pre {
      background-color: #001a1a;
      padding: 12px;
      border-radius: 4px;
      white-space: pre-wrap;
      max-height: 400px;
      overflow-y: auto;
    }
    .vaccinated {
      color: #ff00cc;
      font-weight: bold;
    }
    a {
      color: #00ffff;
    }
    .download-section {
      margin-top: 20px;
      border-top: 1px dashed #00ffcc;
      padding-top: 12px;
    }
  </style>
</head>
<body>
  <h1>🧬 BlueFang BLE Scanner</h1>

  <div class="controls">
    <button onclick="scanBLE()">Start Scan</button>
    <button onclick="clearLog()">Clear Log</button>
    <button onclick="downloadCSV()">Export Log</button>
  </div>

  <div class="status" id="status">Status: Ready</div>

  <pre id="log"></pre>

  <div class="download-section">
    <p>🧬 GLYPHCHAIN EVIDENCE DROP</p>
    <p>🧬 Android BLE SCANNER App — <a href="https://drive.google.com/file/d/1VHI4ZhmkYDQ0t5Gnxqt-SfXOxTEu0Yki/view?usp=drivesdk" target="_blank">DOWNLOAD NOW</a></p>
    <p>📡 It's time to Detonate the Obsolete Simulation 💥</p>
  </div>

  <script>
    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('status');

    let scannedDevices = JSON.parse(localStorage.getItem('bluefang_log') || '[]');

    const suspiciousPatterns = [
      /^ac:23:3f/i,
      /^00:1A:7D/i,
      /^4c:65:a8/i,
      /^66:55:44/i
    ];

    const RSSI_THRESHOLD = -90; // optional filter (more negative = weaker signal)

    function logDevice(device, rssi = null) {
      const timestamp = new Date().toLocaleTimeString();
      const mac = device.id || device.name || "Unknown";
      const isVaccinated = suspiciousPatterns.some(pat => pat.test(mac));
      const rssiText = rssi ? ` RSSI: ${rssi}dBm` : '';
      const line = `${timestamp} - ${mac}${rssiText}`;

      const entry = isVaccinated
        ? `<div class="vaccinated">⚠️ VACCINATED SIGNAL DETECTED: ${line}</div>`
        : line;

      logEl.innerHTML = entry + '\n' + logEl.innerHTML;

      scannedDevices.push({ time: timestamp, mac: mac, rssi: rssi || '', vaccinated: isVaccinated });
      localStorage.setItem('bluefang_log', JSON.stringify(scannedDevices));
    }

    async function scanBLE() {
      try {
        statusEl.textContent = "Status: Scanning...";
        statusEl.classList.add("scanning");

        const device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true });
        const rssi = device.adData?.rssi || null;

        if (!rssi || rssi > RSSI_THRESHOLD) {
          logDevice(device, rssi);
        }

        statusEl.textContent = "Status: Ready";
        statusEl.classList.remove("scanning");
      } catch (error) {
        statusEl.textContent = "Error: " + error.message;
        statusEl.classList.remove("scanning");
      }
    }

    function clearLog() {
      logEl.innerHTML = '';
      scannedDevices = [];
      localStorage.removeItem('bluefang_log');
      statusEl.textContent = "Status: Log cleared";
    }

    function downloadCSV() {
      const rows = [
        ["Time", "MAC", "RSSI", "Vaccinated"]
      ].concat(scannedDevices.map(d => [d.time, d.mac, d.rssi, d.vaccinated]));

      const csv = rows.map(r => r.join(",")).join("\n");
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = "bluefang_log.csv";
      a.click();
      URL.revokeObjectURL(url);
    }

    // Load saved logs on page load
    window.addEventListener('load', () => {
      scannedDevices.forEach(d => {
        const text = `${d.time} - ${d.mac}${d.rssi ? ` RSSI: ${d.rssi}dBm` : ''}`;
        const entry = d.vaccinated
          ? `<div class="vaccinated">⚠️ VACCINATED SIGNAL DETECTED: ${text}</div>`
          : text;
        logEl.innerHTML += entry + '\n';
      });
    });

    // Keyboard shortcuts
    document.addEventListener("keydown", e => {
      if (e.ctrlKey && e.key === "Enter") scanBLE();
      if (e.ctrlKey && e.key === "Delete") clearLog();
    });
  </script>
</body>
</html>
