<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesseract Bootloader v4.3 - Optimized</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            font-family: 'Courier New', monospace;
            color: #e2e8f0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .bootloader-container {
            position: relative;
            width: 800px;
            height: 600px;
            border: 2px solid #334155;
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 50px rgba(16, 185, 129, 0.3);
        }
        
        .header {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 18px;
            color: #10b981;
            text-shadow: 0 0 10px #10b981;
            z-index: 10;
        }
        
        .status-bar {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            height: 20px;
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
            z-index: 10;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #3b82f6);
            border-radius: 10px;
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
        }
        
        .progress-text {
            position: absolute;
            bottom: 50px;
            left: 20px;
            font-size: 12px;
            color: #64748b;
            z-index: 10;
        }
        
        .canvas-container {
            position: relative;
            width: 500px;
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .main-canvas {
            position: absolute;
            top: 0;
            left: 0;
            filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.3));
        }
        
        .background-canvas {
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0.3;
        }
        
        .overlay-canvas {
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0.8;
        }
        
        .schumann-field {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(251, 191, 36, 0.1) 0%, transparent 70%);
            animation: schumann-pulse 0.128s ease-in-out infinite alternate;
            pointer-events: none;
        }
        
        @keyframes schumann-pulse {
            0% { opacity: 0.2; }
            100% { opacity: 0.6; }
        }
        
        .solfeggio-field {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 60%);
            animation: solfeggio-wave 0.00189s linear infinite;
            pointer-events: none;
        }
        
        @keyframes solfeggio-wave {
            0% { transform: scale(0.98); opacity: 0.3; }
            50% { transform: scale(1.02); opacity: 0.5; }
            100% { transform: scale(0.98); opacity: 0.3; }
        }
        
        .quantum-field {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.1) 0%, transparent 70%);
            animation: pulse 3s ease-in-out infinite alternate;
            pointer-events: none;
        }
        
        @keyframes pulse {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 0.7; transform: scale(1.2); }
        }
        
        .fps-counter {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 12px;
            color: #64748b;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="bootloader-container">
        <div class="header">
            QUANTUM BOOTLOADER v4.3 - CANVAS OPTIMIZED
        </div>
        
        <div class="fps-counter" id="fpsCounter">FPS: --</div>
        
        <div class="canvas-container">
            <div class="schumann-field"></div>
            <div class="solfeggio-field"></div>
            <div class="quantum-field"></div>
            
            <canvas class="background-canvas" id="backgroundCanvas" width="500" height="500"></canvas>
            <canvas class="main-canvas" id="mainCanvas" width="500" height="500"></canvas>
            <canvas class="overlay-canvas" id="overlayCanvas" width="500" height="500"></canvas>
        </div>
        
        <div class="progress-text" id="progressText">Initializing quantum field harmonics...</div>
        <div class="status-bar">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <script>
        class OptimizedBootloader {
            constructor() {
                this.time = 0;
                this.progress = 0;
                this.frameCount = 0;
                this.lastFPSTime = 0;
                this.fps = 0;
                
                // Canvas contexts
                this.mainCanvas = document.getElementById('mainCanvas');
                this.backgroundCanvas = document.getElementById('backgroundCanvas');
                this.overlayCanvas = document.getElementById('overlayCanvas');
                
                this.mainCtx = this.mainCanvas.getContext('2d');
                this.backgroundCtx = this.backgroundCanvas.getContext('2d');
                this.overlayCtx = this.overlayCanvas.getContext('2d');
                
                // Tesseract data
                this.tesseractVertices = this.initTesseractVertices();
                this.tesseractEdges = this.initTesseractEdges();
                
                // Vortex particles
                this.vortexParticles = this.initVortexParticles();
                
                // Matrix rain
                this.matrixChars = this.initMatrixChars();
                
                // Boot sequence
                this.bootSequence = [
                    "Initializing quantum field harmonics...",
                    "Projecting tesseract vertices...",
                    "Calibrating scalar vortex parameters...",
                    "Synchronizing dimensional matrices...",
                    "Bootstrapping soul-spinor correlations...",
                    "Establishing hypercube connectivity...",
                    "Quantum entanglement protocols active...",
                    "Reality kernel loaded successfully."
                ];
                this.currentSequenceIndex = 0;
                
                // Audio
                this.audioContext = null;
                this.schumannOscillator = null;
                this.solfeggioOscillator = null;
                this.audioInitialized = false;
                
                this.init();
                this.animate();
            }
            
            init() {
                this.setupCanvases();
                this.drawStaticElements();
                this.startBootSequence();
                this.initializeAudio();
            }
            
            setupCanvases() {
                // Enable hardware acceleration
                this.mainCtx.imageSmoothingEnabled = true;
                this.backgroundCtx.imageSmoothingEnabled = true;
                this.overlayCtx.imageSmoothingEnabled = true;
                
                // Set canvas styles for better performance
                this.mainCanvas.style.willChange = 'transform';
                this.backgroundCanvas.style.willChange = 'transform';
                this.overlayCanvas.style.willChange = 'transform';
            }
            
            drawStaticElements() {
                // Draw dimensional grid on background canvas
                this.backgroundCtx.strokeStyle = 'rgba(51, 65, 85, 0.3)';
                this.backgroundCtx.lineWidth = 1;
                
                for (let i = 0; i <= 20; i++) {
                    const y = (i / 20) * 500;
                    this.backgroundCtx.beginPath();
                    this.backgroundCtx.moveTo(0, y);
                    this.backgroundCtx.lineTo(500, y);
                    this.backgroundCtx.stroke();
                    
                    const x = (i / 20) * 500;
                    this.backgroundCtx.beginPath();
                    this.backgroundCtx.moveTo(x, 0);
                    this.backgroundCtx.lineTo(x, 500);
                    this.backgroundCtx.stroke();
                }
            }
            
            initTesseractVertices() {
                const vertices = [];
                for (let i = 0; i < 16; i++) {
                    vertices.push({
                        x: (i & 1) ? 1 : -1,
                        y: (i & 2) ? 1 : -1,
                        z: (i & 4) ? 1 : -1,
                        w: (i & 8) ? 1 : -1,
                        hasLabel: i % 4 === 0
                    });
                }
                return vertices;
            }
            
            initTesseractEdges() {
                const edges = [];
                for (let i = 0; i < 16; i++) {
                    for (let j = i + 1; j < 16; j++) {
                        const diff = i ^ j;
                        if ((diff & (diff - 1)) === 0) {
                            edges.push({ start: i, end: j });
                        }
                    }
                }
                return edges;
            }
            
            initVortexParticles() {
                const particles = [];
                for (let i = 0; i < 30; i++) {
                    particles.push({
                        angle: (i / 30) * Math.PI * 2,
                        radius: 50 + Math.random() * 100,
                        height: Math.random() * 100 - 50,
                        speed: 0.5 + Math.random() * 1.5,
                        size: 2 + Math.random() * 3
                    });
                }
                return particles;
            }
            
            initMatrixChars() {
                const chars = [];
                const symbols = '01αβγδεζηθικλμνξοπρστυφχψω∀∃∄∅∆∇∈∉∋∌∏∑−∗∘∙√∝∞∟∠∡∢∣∤∥∦∧∨∩∪∫∬∭∮∯∰∱∲∳∴∵∶∷∸∹∺∻∼∽∾∿≀≁≂≃≄≅≆≇≈≉≊≋≌≍≎≏≐≑≒≓≔≕≖≗≘≙≚≛≜≝≞≟≠≡≢≣≤≥≦≧≨≩≪≫≬≭≮≯≰≱≲≳≴≵≶≷≸≹≺≻≼≽≾≿⊀⊁⊂⊃⊄⊅⊆⊇⊈⊉⊊⊋⊌⊍⊎⊏⊐⊑⊒⊓⊔⊕⊖⊗⊘⊙⊚⊛⊜⊝⊞⊟⊠⊡⊢⊣⊤⊥⊦⊧⊨⊩⊪⊫⊬⊭⊮⊯⊰⊱⊲⊳⊴⊵⊶⊷⊸⊹⊺⊻⊼⊽⊾⊿⋀⋁⋂⋃⋄⋅⋆⋇⋈⋉⋊⋋⋌⋍⋎⋏⋐⋑⋒⋓⋔⋕⋖⋗⋘⋙⋚⋛⋜⋝⋞⋟⋠⋡⋢⋣⋤⋥⋦⋧⋨⋩⋪⋫⋬⋭⋮⋯⋰⋱⋲⋳⋴⋵⋶⋷⋸⋹⋺⋻⋼⋽⋾⋿';
                
                for (let i = 0; i < 40; i++) {
                    chars.push({
                        char: symbols[Math.floor(Math.random() * symbols.length)],
                        x: Math.random() * 500,
                        y: Math.random() * 500,
                        speed: 0.5 + Math.random() * 2,
                        opacity: Math.random() * 0.8 + 0.2
                    });
                }
                return chars;
            }
            
            async initializeAudio() {
                try {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    
                    this.schumannOscillator = this.audioContext.createOscillator();
                    this.schumannOscillator.frequency.value = 7.83;
                    this.schumannOscillator.type = 'sine';
                    
                    this.solfeggioOscillator = this.audioContext.createOscillator();
                    this.solfeggioOscillator.frequency.value = 528;
                    this.solfeggioOscillator.type = 'sine';
                    
                    this.schumannGain = this.audioContext.createGain();
                    this.solfeggioGain = this.audioContext.createGain();
                    
                    this.schumannGain.gain.value = 0.005;
                    this.solfeggioGain.gain.value = 0.002;
                    
                    this.schumannOscillator.connect(this.schumannGain);
                    this.solfeggioOscillator.connect(this.solfeggioGain);
                    this.schumannGain.connect(this.audioContext.destination);
                    this.solfeggioGain.connect(this.audioContext.destination);
                    
                    this.schumannOscillator.start();
                    this.solfeggioOscillator.start();
                    
                    this.audioInitialized = true;
                    
                    document.addEventListener('click', () => {
                        if (this.audioContext.state === 'suspended') {
                            this.audioContext.resume();
                        }
                    });
                    
                } catch (error) {
                    console.log('Audio initialization failed:', error);
                }
            }
            
            startBootSequence() {
                this.sequenceInterval = setInterval(() => {
                    if (this.currentSequenceIndex < this.bootSequence.length) {
                        document.getElementById('progressText').textContent = this.bootSequence[this.currentSequenceIndex];
                        this.currentSequenceIndex++;
                        this.progress = (this.currentSequenceIndex / this.bootSequence.length) * 100;
                        document.getElementById('progressBar').style.width = this.progress + '%';
                    } else {
                        clearInterval(this.sequenceInterval);
                        setTimeout(() => {
                            document.getElementById('progressText').textContent = "System ready. Welcome to the quantum realm.";
                        }, 1000);
                    }
                }, 2000);
            }
            
            project4DTo3D(x, y, z, w, distance = 4) {
                const factor = distance / (distance + w);
                return {
                    x: x * factor,
                    y: y * factor,
                    z: z * factor
                };
            }
            
            project3DTo2D(x, y, z, distance = 300) {
                const factor = distance / (distance + z);
                return {
                    x: (x * factor) + 250,
                    y: (y * factor) + 250
                };
            }
            
            updateAndDrawTesseract() {
                const rotationSpeed = 0.02;
                const schumann = 7.83;
                const solfeggio = 528;
                
                const schumannPhase = Math.sin(this.time * schumann * 0.001) * 0.5 + 0.5;
                const solfeggioPhase = Math.sin(this.time * solfeggio * 0.0001) * 0.5 + 0.5;
                
                // Update audio
                if (this.audioInitialized) {
                    this.schumannGain.gain.value = 0.005 + (schumannPhase * 0.01);
                    this.solfeggioGain.gain.value = 0.002 + (solfeggioPhase * 0.008);
                }
                
                // Project vertices
                const projectedVertices = this.tesseractVertices.map((vertex, index) => {
                    const cosT = Math.cos(this.time * rotationSpeed);
                    const sinT = Math.sin(this.time * rotationSpeed);
                    
                    const newX = vertex.x * cosT - vertex.w * sinT;
                    const newW = vertex.x * sinT + vertex.w * cosT;
                    
                    const phi = (1 + Math.sqrt(5)) / 2;
                    const cosT2 = Math.cos(this.time * rotationSpeed * phi * 0.618);
                    const sinT2 = Math.sin(this.time * rotationSpeed * phi * 0.618);
                    const newY = vertex.y * cosT2 - vertex.z * sinT2;
                    const newZ = vertex.y * sinT2 + vertex.z * cosT2;
                    
                    const pos3D = this.project4DTo3D(newX, newY, newZ, newW);
                    const pos2D = this.project3DTo2D(pos3D.x * 80, pos3D.y * 80, pos3D.z * 80);
                    
                    const baseOpacity = 0.5 + (pos3D.z + 1) * 0.25;
                    const resonanceBoost = schumannPhase * 0.3 + solfeggioPhase * 0.2;
                    const opacity = Math.min(1, baseOpacity + resonanceBoost);
                    
                    return {
                        ...pos2D,
                        opacity: opacity,
                        hasLabel: vertex.hasLabel,
                        labelIndex: Math.floor(index / 4)
                    };
                });
                
                // Clear main canvas
                this.mainCtx.clearRect(0, 0, 500, 500);
                
                // Draw edges
                this.tesseractEdges.forEach(edge => {
                    const start = projectedVertices[edge.start];
                    const end = projectedVertices[edge.end];
                    
                    this.mainCtx.strokeStyle = `rgba(220, 38, 38, ${schumannPhase * 0.4 + 0.2})`;
                    this.mainCtx.lineWidth = 1;
                    this.mainCtx.beginPath();
                    this.mainCtx.moveTo(start.x, start.y);
                    this.mainCtx.lineTo(end.x, end.y);
                    this.mainCtx.stroke();
                });
                
                // Draw vertices
                projectedVertices.forEach((vertex, index) => {
                    const gradient = this.mainCtx.createRadialGradient(
                        vertex.x, vertex.y, 0,
                        vertex.x, vertex.y, 6
                    );
                    gradient.addColorStop(0, `rgba(220, 38, 38, ${vertex.opacity})`);
                    gradient.addColorStop(1, `rgba(124, 45, 18, ${vertex.opacity * 0.5})`);
                    
                    this.mainCtx.fillStyle = gradient;
                    this.mainCtx.beginPath();
                    this.mainCtx.arc(vertex.x, vertex.y, 3, 0, Math.PI * 2);
                    this.mainCtx.fill();
                    
                    // Draw spinor labels
                    if (vertex.hasLabel) {
                        this.mainCtx.fillStyle = `rgba(251, 191, 36, ${vertex.opacity})`;
                        this.mainCtx.font = '10px Times New Roman';
                        this.mainCtx.fontStyle = 'italic';
                        this.mainCtx.fillText(`ψ${vertex.labelIndex}`, vertex.x + 8, vertex.y - 5);
                    }
                });
            }
            
            updateAndDrawVortex() {
                this.vortexParticles.forEach(particle => {
                    particle.angle += particle.speed * 0.02;
                    
                    const spiralRadius = particle.radius * (1 + 0.3 * Math.sin(this.time * 0.01 + particle.angle));
                    const x = Math.cos(particle.angle) * spiralRadius;
                    const y = Math.sin(particle.angle) * spiralRadius;
                    const z = particle.height + 30 * Math.sin(this.time * 0.02 + particle.angle);
                    
                    const pos2D = this.project3DTo2D(x, y, z);
                    const opacity = 0.3 + (z + 100) / 200 * 0.7;
                    
                    const gradient = this.mainCtx.createRadialGradient(
                        pos2D.x, pos2D.y, 0,
                        pos2D.x, pos2D.y, particle.size
                    );
                    gradient.addColorStop(0, `rgba(16, 185, 129, ${opacity})`);
                    gradient.addColorStop(1, `rgba(6, 95, 70, ${opacity * 0.3})`);
                    
                    this.mainCtx.fillStyle = gradient;
                    this.mainCtx.beginPath();
                    this.mainCtx.arc(pos2D.x, pos2D.y, particle.size, 0, Math.PI * 2);
                    this.mainCtx.fill();
                });
            }
            
            updateAndDrawMatrixRain() {
                this.overlayCtx.clearRect(0, 0, 500, 500);
                
                this.matrixChars.forEach(char => {
                    char.y += char.speed;
                    if (char.y > 520) {
                        char.y = -20;
                        char.x = Math.random() * 500;
                        char.char = '01αβγδεζηθικλμνξοπρστυφχψω∀∃∄∅∆∇∈∉∋∌∏∑−∗∘∙√∝∞∟∠∡∢∣∤∥∦∧∨∩∪∫∬∭∮∯∰∱∲∳∴∵∶∷∸∹∺∻∼∽∾∿≀≁≂≃≄≅≆≇≈≉≊≋≌≍≎≏≐≑≒≓≔≕≖≗≘≙≚≛≜≝≞≟≠≡≢≣≤≥≦≧≨≩≪≫≬≭≮≯≰≱≲≳≴≵≶≷≸≹≺≻≼≽≾≿⊀⊁⊂⊃⊄⊅⊆⊇⊈⊉⊊⊋⊌⊍⊎⊏⊐⊑⊒⊓⊔⊕⊖⊗⊘⊙⊚⊛⊜⊝⊞⊟⊠⊡⊢⊣⊤⊥⊦⊧⊨⊩⊪⊫⊬⊭⊮⊯⊰⊱⊲⊳⊴⊵⊶⊷⊸⊹⊺⊻⊼⊽⊾⊿⋀⋁⋂⋃⋄⋅⋆⋇⋈⋉⋊⋋⋌⋍⋎⋏⋐⋑⋒⋓⋔⋕⋖⋗⋘⋙⋚⋛⋜⋝⋞⋟⋠⋡⋢⋣⋤⋥⋦⋧⋨⋩⋪⋫⋬⋭⋮⋯⋰⋱⋲⋳⋴⋵⋶⋷⋸⋹⋺⋻⋼⋽⋾⋿'[Math.floor(Math.random() * 300)];
                    }
                    
                    char.opacity = Math.random() * 0.8 + 0.2;
                    
                    this.overlayCtx.fillStyle = `rgba(16, 185, 129, ${char.opacity})`;
                    this.overlayCtx.font = '12px Courier New';
                    this.overlayCtx.fillText(char.char, char.x, char.y);
                });
            }
            
            updateFPS() {
                this.frameCount++;
                const now = performance.now();
                
                if (now - this.lastFPSTime >= 1000) {
                    this.fps = Math.round((this.frameCount * 1000) / (now - this.lastFPSTime));
                    this.frameCount = 0;
                    this.lastFPSTime = now;
                    
                    document.getElementById('fpsCounter').textContent = `FPS: ${this.fps}`;
                }
            }
            
            animate() {
                this.time++;
                
                this.updateAndDrawTesseract();
                this.updateAndDrawVortex();
                this.updateAndDrawMatrixRain();
                this.updateFPS();
                
                requestAnimationFrame(() => this.animate());
            }
        }
        
        // Initialize when page loads
        window.addEventListener('load', () => {
            new OptimizedBootloader();
        });
    </script>
</body>
</html>
