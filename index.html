<!-- ========== MASTER SCRIPT (galactic‑swirl update) ========== -->
<script>
class GalacticBootloader{
  constructor(){
    /* canvas handles */
    this.main   = document.getElementById('mainCanvas');
    this.back   = document.getElementById('backgroundCanvas');
    this.overlay= document.getElementById('overlayCanvas');
    if(!this.main)return;

    this.ctx    = this.main.getContext('2d');
    this.bctx   = this.back.getContext('2d');
    this.octx   = this.overlay.getContext('2d');

    /* particle set for spiral arms */
    this.particles = [];
    for(let i=0;i<220;i++){
      this.particles.push(this.makeParticle());
    }

    /* boot‑sequence text */
    this.sequence=[
      "Initializing temporal recursion protocols…",
      "Calibrating fractal memory matrix…",
      "Projecting divine hypercube vertices…",
      "Synchronizing timeline potentiality fields…",
      "Bootstrapping soul‑spinor correlations…",
      "Establishing Kingdom Grid connectivity…",
      "Reality kernel loaded. Welcome to New Jerusalem Engine."
    ];
    this.seqIndex = 0;

    /* misc state */
    this.time=0;
    this.lastFPS=performance.now();
    this.frameCount=0;

    /* bind + go */
    window.addEventListener('resize',()=>this.resize(),{passive:true});
    this.resize();
    this.runBootSequence();
    requestAnimationFrame(t=>this.animate(t));
  }

  /* --- helpers ------------------------------------------------ */
  makeParticle(){
    const arm   = Math.floor(Math.random()*4);           // which spiral arm (0‑3)
    const theta = (arm*Math.PI/2)+Math.random()*0.2;     // small spread
    const r     = 5+Math.random()*30;                    // initial radius
    return {theta,r,speed:0.015+Math.random()*0.02,size:1+Math.random()*2};
  }
  resize(){
    const w=this.main.parentElement.clientWidth,
          h=this.main.parentElement.clientHeight;
    [this.main,this.back,this.overlay].forEach(c=>{c.width=w;c.height=h});
  }

  /* --- boot‑sequence progress bar ------------------------------ */
  runBootSequence(){
    const bar=document.getElementById('progressBar'),
          txt=document.getElementById('progressText');
    const step=()=>{
      txt.textContent=this.sequence[this.seqIndex];
      bar.style.width=((this.seqIndex+1)/this.sequence.length*100)+'%';
      this.seqIndex++;
      if(this.seqIndex<this.sequence.length) setTimeout(step,1800);
      else txt.textContent="New Jerusalem OS: System Activated.";
    };
    step();
  }

  /* --- animation ---------------------------------------------- */
  animate(now){
    const dt=(now-this.time)*0.001;          // seconds
    this.time=now;

    this.updateParticles(dt);
    this.render();

    /* FPS counter */
    this.frameCount++;
    if(now-this.lastFPS>1000){
      document.getElementById('fpsCounter').textContent="FPS: "+this.frameCount;
      this.frameCount=0;this.lastFPS=now;
    }

    requestAnimationFrame(t=>this.animate(t));
  }

  updateParticles(dt){
    const growth=22;                         // radial growth rate
    this.particles.forEach(p=>{
      p.theta += p.speed;                    // swirl
      p.r     += growth*dt;                 // outward drift
      /* wrap back when off‑screen */
      const limit=Math.max(this.main.width,this.main.height)*0.7;
      if(p.r>limit){
        Object.assign(p,this.makeParticle());
      }
    });
  }

  render(){
    const ctx=this.ctx,w=this.main.width,h=this.main.height,
          cx=w/2,cy=h/2;

    ctx.clearRect(0,0,w,h);

    /* draw particles */
    ctx.fillStyle='rgba(0,255,136,0.85)';
    this.particles.forEach(p=>{
      const x=cx+p.r*Math.cos(p.theta),
            y=cy+p.r*Math.sin(p.theta);
      ctx.beginPath();
      ctx.arc(x,y,p.size,0,Math.PI*2);
      ctx.fill();
    });
  }
}

/* kick it off once DOM ready */
window.addEventListener('DOMContentLoaded',()=>new GalacticBootloader());
</script>
