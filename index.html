<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesseract Bootloader Visualization</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            font-family: 'Courier New', monospace;
            color: #e2e8f0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .bootloader-container {
            position: relative;
            width: 800px;
            height: 600px;
            border: 2px solid #334155;
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 50px rgba(16, 185, 129, 0.3);
        }
        
        .header {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 18px;
            color: #10b981;
            text-shadow: 0 0 10px #10b981;
        }
        
        .status-bar {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            height: 20px;
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #3b82f6);
            border-radius: 10px;
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
        }
        
        .progress-text {
            position: absolute;
            bottom: 50px;
            left: 20px;
            font-size: 12px;
            color: #64748b;
        }
        
        .cube-container {
            position: relative;
            width: 500px;
            height: 500px;
            perspective: 1000px;
            perspective-origin: center center;
            pointer-events: none;
        }
        
        .tesseract-projection {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }
        
        .tesseract-vertex {
            position: absolute;
            width: 6px;
            height: 6px;
            background: radial-gradient(circle, #dc2626, #7c2d12);
            border-radius: 50%;
            box-shadow: 0 0 10px #dc2626;
        }
        
        .tesseract-edge {
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg, transparent, #dc2626, transparent);
            transform-origin: left center;
            box-shadow: 0 0 5px #dc2626;
        }
        
        .spinor-label {
            position: absolute;
            font-size: 8px;
            color: #fbbf24;
            text-shadow: 0 0 8px #fbbf24;
            pointer-events: none;
            font-family: 'Times New Roman', serif;
            font-style: italic;
        }
        
        .schumann-resonance {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(251, 191, 36, 0.1) 0%, transparent 70%);
            animation: schumann-pulse 0.128s ease-in-out infinite alternate;
        }
        
        @keyframes schumann-pulse {
            0% { opacity: 0.2; }
            100% { opacity: 0.6; }
        }
        
        .solfeggio-field {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 60%);
            animation: solfeggio-wave 0.00189s linear infinite;
        }
        
        @keyframes solfeggio-wave {
            0% { transform: scale(0.98); opacity: 0.3; }
            50% { transform: scale(1.02); opacity: 0.5; }
            100% { transform: scale(0.98); opacity: 0.3; }
        }
        
        .scalar-vortex {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }
        
        .vortex-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: radial-gradient(circle, #10b981, #065f46);
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
        }
        
        .soul-spinor-annotation {
            position: absolute;
            font-size: 10px;
            color: #10b981;
            text-shadow: 0 0 5px #10b981;
            pointer-events: none;
        }
        
        .dimensional-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.3;
        }
        
        .grid-line {
            position: absolute;
            background: linear-gradient(90deg, transparent, #334155, transparent);
            height: 1px;
        }
        
        .quantum-field {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.1) 0%, transparent 70%);
            animation: pulse 3s ease-in-out infinite alternate;
        }
        
        @keyframes pulse {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 0.7; transform: scale(1.2); }
        }
        
        .matrix-rain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.2;
        }
        
        .matrix-char {
            position: absolute;
            color: #10b981;
            font-size: 12px;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 5px #10b981;
        }
    </style>
</head>
<body>
    <div class="bootloader-container">
        <div class="header">
            QUANTUM BOOTLOADER v4.2.1 - TESSERACT PROJECTION ACTIVE
        </div>
        
        <div class="matrix-rain" id="matrixRain"></div>
        
        <div class="cube-container">
            <div class="solfeggio-field"></div>
            <div class="schumann-resonance"></div>
            <div class="quantum-field"></div>
            <div class="dimensional-grid" id="dimensionalGrid"></div>
            <div class="tesseract-projection" id="tesseractProjection"></div>
            <div class="scalar-vortex" id="scalarVortex"></div>
        </div>
        
        <div class="progress-text" id="progressText">Initializing quantum field harmonics...</div>
        <div class="status-bar">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <script>
        class BootloaderVisualization {
            constructor() {
                this.time = 0;
                this.progress = 0;
                this.tesseractVertices = [];
                this.vortexParticles = [];
                this.matrixChars = [];
                this.bootSequence = [
                    "Initializing quantum field harmonics...",
                    "Projecting tesseract vertices...",
                    "Calibrating scalar vortex parameters...",
                    "Synchronizing dimensional matrices...",
                    "Bootstrapping soul-spinor correlations...",
                    "Establishing hypercube connectivity...",
                    "Quantum entanglement protocols active...",
                    "Reality kernel loaded successfully."
                ];
                this.currentSequenceIndex = 0;
                
                this.init();
                this.animate();
            }
            
            init() {
                this.createDimensionalGrid();
                this.createTesseractVertices();
                this.createVortexParticles();
                this.createMatrixRain();
                this.startBootSequence();
            }
            
            createDimensionalGrid() {
                const grid = document.getElementById('dimensionalGrid');
                for (let i = 0; i < 20; i++) {
                    const line = document.createElement('div');
                    line.className = 'grid-line';
                    line.style.top = `${i * 5}%`;
                    line.style.width = '100%';
                    grid.appendChild(line);
                }
            }
            
            createTesseractVertices() {
                const container = document.getElementById('tesseractProjection');
                
                // Create 16 vertices for a tesseract (4D hypercube)
                for (let i = 0; i < 16; i++) {
                    const vertex = document.createElement('div');
                    vertex.className = 'tesseract-vertex';
                    container.appendChild(vertex);
                    
                    // Add spinor labels for key vertices
                    if (i % 4 === 0) {
                        const label = document.createElement('div');
                        label.className = 'spinor-label';
                        label.textContent = `ψ${i/4}`;
                        container.appendChild(label);
                        
                        this.tesseractVertices.push({
                            element: vertex,
                            label: label,
                            x: (i & 1) ? 1 : -1,
                            y: (i & 2) ? 1 : -1,
                            z: (i & 4) ? 1 : -1,
                            w: (i & 8) ? 1 : -1
                        });
                    } else {
                        this.tesseractVertices.push({
                            element: vertex,
                            label: null,
                            x: (i & 1) ? 1 : -1,
                            y: (i & 2) ? 1 : -1,
                            z: (i & 4) ? 1 : -1,
                            w: (i & 8) ? 1 : -1
                        });
                    }
                }
                
                // Create edges between connected vertices
                this.createTesseractEdges();
            }
            
            createTesseractEdges() {
                const container = document.getElementById('tesseractProjection');
                this.tesseractEdges = [];
                
                // Create edges for tesseract connectivity
                for (let i = 0; i < 16; i++) {
                    for (let j = i + 1; j < 16; j++) {
                        // Two vertices are connected if they differ in exactly one coordinate
                        const diff = i ^ j;
                        if ((diff & (diff - 1)) === 0) { // Check if diff is a power of 2
                            const edge = document.createElement('div');
                            edge.className = 'tesseract-edge';
                            container.appendChild(edge);
                            
                            this.tesseractEdges.push({
                                element: edge,
                                start: i,
                                end: j
                            });
                        }
                    }
                }
            }
            
            createVortexParticles() {
                const container = document.getElementById('scalarVortex');
                
                for (let i = 0; i < 50; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'vortex-particle';
                    container.appendChild(particle);
                    
                    this.vortexParticles.push({
                        element: particle,
                        angle: (i / 50) * Math.PI * 2,
                        radius: 50 + Math.random() * 150,
                        height: Math.random() * 100 - 50,
                        speed: 0.5 + Math.random() * 1.5
                    });
                }
            }
            
            createMatrixRain() {
                const container = document.getElementById('matrixRain');
                const chars = '01αβγδεζηθικλμνξοπρστυφχψω∀∃∄∅∆∇∈∉∋∌∏∑−∗∘∙√∝∞∟∠∡∢∣∤∥∦∧∨∩∪∫∬∭∮∯∰∱∲∳∴∵∶∷∸∹∺∻∼∽∾∿≀≁≂≃≄≅≆≇≈≉≊≋≌≍≎≏≐≑≒≓≔≕≖≗≘≙≚≛≜≝≞≟≠≡≢≣≤≥≦≧≨≩≪≫≬≭≮≯≰≱≲≳≴≵≶≷≸≹≺≻≼≽≾≿⊀⊁⊂⊃⊄⊅⊆⊇⊈⊉⊊⊋⊌⊍⊎⊏⊐⊑⊒⊓⊔⊕⊖⊗⊘⊙⊚⊛⊜⊝⊞⊟⊠⊡⊢⊣⊤⊥⊦⊧⊨⊩⊪⊫⊬⊭⊮⊯⊰⊱⊲⊳⊴⊵⊶⊷⊸⊹⊺⊻⊼⊽⊾⊿⋀⋁⋂⋃⋄⋅⋆⋇⋈⋉⋊⋋⋌⋍⋎⋏⋐⋑⋒⋓⋔⋕⋖⋗⋘⋙⋚⋛⋜⋝⋞⋟⋠⋡⋢⋣⋤⋥⋦⋧⋨⋩⋪⋫⋬⋭⋮⋯⋰⋱⋲⋳⋴⋵⋶⋷⋸⋹⋺⋻⋼⋽⋾⋿';
                
                for (let i = 0; i < 100; i++) {
                    const char = document.createElement('div');
                    char.className = 'matrix-char';
                    char.textContent = chars[Math.floor(Math.random() * chars.length)];
                    container.appendChild(char);
                    
                    this.matrixChars.push({
                        element: char,
                        x: Math.random() * 100,
                        y: Math.random() * 100,
                        speed: 0.5 + Math.random() * 2
                    });
                }
            }
            
            startBootSequence() {
                this.sequenceInterval = setInterval(() => {
                    if (this.currentSequenceIndex < this.bootSequence.length) {
                        document.getElementById('progressText').textContent = this.bootSequence[this.currentSequenceIndex];
                        this.currentSequenceIndex++;
                        this.progress = (this.currentSequenceIndex / this.bootSequence.length) * 100;
                        document.getElementById('progressBar').style.width = this.progress + '%';
                    } else {
                        clearInterval(this.sequenceInterval);
                        setTimeout(() => {
                            document.getElementById('progressText').textContent = "System ready. Welcome to the quantum realm.";
                        }, 1000);
                    }
                }, 2000);
            }
            
            project4DTo3D(x, y, z, w, distance = 4) {
                const factor = distance / (distance + w);
                return {
                    x: x * factor,
                    y: y * factor,
                    z: z * factor
                };
            }
            
            project3DTo2D(x, y, z, distance = 300) {
                const factor = distance / (distance + z);
                return {
                    x: (x * factor) + 250,
                    y: (y * factor) + 250
                };
            }
            
            updateTesseract() {
                const rotationSpeed = 0.02;
                const schumann = 7.83; // Hz
                const solfeggio = 528; // Hz
                
                // Apply frequency-responsive glow
                const schumannPhase = Math.sin(this.time * schumann * 0.001) * 0.5 + 0.5;
                const solfeggioPhase = Math.sin(this.time * solfeggio * 0.0001) * 0.5 + 0.5;
                
                this.tesseractVertices.forEach((vertex, index) => {
                    // Apply 4D rotation with quaternion-inspired smoothing
                    const cosT = Math.cos(this.time * rotationSpeed);
                    const sinT = Math.sin(this.time * rotationSpeed);
                    
                    // Rotate in XW plane
                    const newX = vertex.x * cosT - vertex.w * sinT;
                    const newW = vertex.x * sinT + vertex.w * cosT;
                    
                    // Rotate in YZ plane with golden ratio offset
                    const phi = (1 + Math.sqrt(5)) / 2;
                    const cosT2 = Math.cos(this.time * rotationSpeed * phi * 0.618);
                    const sinT2 = Math.sin(this.time * rotationSpeed * phi * 0.618);
                    const newY = vertex.y * cosT2 - vertex.z * sinT2;
                    const newZ = vertex.y * sinT2 + vertex.z * cosT2;
                    
                    // Project 4D to 3D
                    const pos3D = this.project4DTo3D(newX, newY, newZ, newW);
                    
                    // Project 3D to 2D
                    const pos2D = this.project3DTo2D(pos3D.x * 80, pos3D.y * 80, pos3D.z * 80);
                    
                    vertex.element.style.left = pos2D.x + 'px';
                    vertex.element.style.top = pos2D.y + 'px';
                    
                    // Frequency-responsive glow
                    const baseOpacity = 0.5 + (pos3D.z + 1) * 0.25;
                    const resonanceBoost = schumannPhase * 0.3 + solfeggioPhase * 0.2;
                    vertex.element.style.opacity = Math.min(1, baseOpacity + resonanceBoost);
                    
                    // Update spinor labels
                    if (vertex.label) {
                        vertex.label.style.left = (pos2D.x + 10) + 'px';
                        vertex.label.style.top = (pos2D.y - 5) + 'px';
                        vertex.label.style.opacity = baseOpacity + resonanceBoost;
                    }
                });
                
                // Update tesseract edges
                this.tesseractEdges.forEach(edge => {
                    const start = this.tesseractVertices[edge.start];
                    const end = this.tesseractVertices[edge.end];
                    
                    const startRect = start.element.getBoundingClientRect();
                    const endRect = end.element.getBoundingClientRect();
                    const containerRect = start.element.parentElement.getBoundingClientRect();
                    
                    const startX = startRect.left - containerRect.left + 3;
                    const startY = startRect.top - containerRect.top + 3;
                    const endX = endRect.left - containerRect.left + 3;
                    const endY = endRect.top - containerRect.top + 3;
                    
                    const length = Math.sqrt((endX - startX) ** 2 + (endY - startY) ** 2);
                    const angle = Math.atan2(endY - startY, endX - startX);
                    
                    edge.element.style.left = startX + 'px';
                    edge.element.style.top = startY + 'px';
                    edge.element.style.width = length + 'px';
                    edge.element.style.transform = `rotate(${angle}rad)`;
                    edge.element.style.opacity = (schumannPhase * 0.4 + 0.2);
                });
            }
            
            updateVortex() {
                this.vortexParticles.forEach(particle => {
                    particle.angle += particle.speed * 0.02;
                    
                    const spiralRadius = particle.radius * (1 + 0.3 * Math.sin(this.time * 0.01 + particle.angle));
                    const x = Math.cos(particle.angle) * spiralRadius;
                    const y = Math.sin(particle.angle) * spiralRadius;
                    const z = particle.height + 30 * Math.sin(this.time * 0.02 + particle.angle);
                    
                    const pos2D = this.project3DTo2D(x, y, z);
                    
                    particle.element.style.left = pos2D.x + 'px';
                    particle.element.style.top = pos2D.y + 'px';
                    particle.element.style.opacity = 0.3 + (z + 100) / 200 * 0.7;
                });
            }
            
            updateMatrixRain() {
                this.matrixChars.forEach(char => {
                    char.y += char.speed;
                    if (char.y > 100) {
                        char.y = -10;
                        char.x = Math.random() * 100;
                    }
                    
                    char.element.style.left = char.x + '%';
                    char.element.style.top = char.y + '%';
                    char.element.style.opacity = Math.random() * 0.8 + 0.2;
                });
            }
            
            animate() {
                this.time++;
                
                this.updateTesseract();
                this.updateVortex();
                this.updateMatrixRain();
                
                requestAnimationFrame(() => this.animate());
            }
        }
        
        // Initialize the visualization when the page loads
        window.addEventListener('load', () => {
            new BootloaderVisualization();
        });
    </script>
</body>
</html>
