<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sacred Breath Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            height: 100vh;
            color: #fff;
            position: relative;
        }

        .cosmic-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, 
                rgba(30, 0, 50, 0.8) 0%,
                rgba(10, 0, 30, 0.9) 40%,
                rgba(0, 0, 0, 1) 100%);
            z-index: -2;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            animation: twinkle 3s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.3; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        .main-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .sacred-core {
            position: relative;
            width: 500px;
            height: 500px;
            transform-style: preserve-3d;
            animation: cosmicRotation 60s linear infinite;
        }

        .central-orb {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, 
                rgba(255, 255, 255, 1) 0%,
                rgba(255, 200, 100, 0.9) 20%,
                rgba(100, 200, 255, 0.7) 50%,
                rgba(150, 50, 255, 0.5) 80%,
                transparent 100%);
            box-shadow: 
                0 0 60px rgba(255, 255, 255, 0.8),
                0 0 120px rgba(255, 200, 100, 0.6),
                0 0 180px rgba(100, 200, 255, 0.4);
            z-index: 10;
            animation: orbPulse 4s ease-in-out infinite;
        }

        .breath-aura {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle at center, 
                rgba(255, 100, 100, 0.3) 0%,
                rgba(255, 100, 100, 0.1) 50%,
                transparent 100%);
            opacity: 0;
            transition: all 2s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 5;
        }

        .breath-aura.active {
            opacity: 1;
        }

        .breath-aura.inhale {
            transform: translate(-50%, -50%) scale(1.3);
            background: radial-gradient(circle at center, 
                rgba(100, 255, 100, 0.4) 0%,
                rgba(100, 255, 100, 0.2) 50%,
                transparent 100%);
            box-shadow: 0 0 100px rgba(100, 255, 100, 0.6);
        }

        .breath-aura.exhale {
            transform: translate(-50%, -50%) scale(0.7);
            background: radial-gradient(circle at center, 
                rgba(100, 100, 255, 0.4) 0%,
                rgba(100, 100, 255, 0.2) 50%,
                transparent 100%);
            box-shadow: 0 0 100px rgba(100, 100, 255, 0.6);
        }

        .sacred-rings {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .ring {
            position: absolute;
            border: 2px solid;
            border-radius: 50%;
            opacity: 0.6;
        }

        .ring-1 {
            width: 200px;
            height: 200px;
            top: 150px;
            left: 150px;
            border-color: rgba(255, 200, 100, 0.8);
            animation: ringRotate1 20s linear infinite;
            box-shadow: 0 0 20px rgba(255, 200, 100, 0.4);
        }

        .ring-2 {
            width: 300px;
            height: 300px;
            top: 100px;
            left: 100px;
            border-color: rgba(100, 200, 255, 0.8);
            animation: ringRotate2 15s linear infinite reverse;
            box-shadow: 0 0 20px rgba(100, 200, 255, 0.4);
        }

        .ring-3 {
            width: 400px;
            height: 400px;
            top: 50px;
            left: 50px;
            border-color: rgba(255, 100, 255, 0.8);
            animation: ringRotate3 25s linear infinite;
            box-shadow: 0 0 20px rgba(255, 100, 255, 0.4);
        }

        .geometry-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.3;
            animation: geometryFloat 30s ease-in-out infinite;
        }

        .sacred-symbol {
            position: absolute;
            width: 2px;
            height: 60px;
            background: linear-gradient(to bottom, 
                rgba(255, 255, 255, 0.8) 0%,
                rgba(255, 255, 255, 0.2) 100%);
            transform-origin: bottom center;
        }

        .particle-field {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .energy-particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            box-shadow: 0 0 6px currentColor;
            animation: particleDrift 15s linear infinite;
        }

        .hud-container {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            z-index: 100;
            pointer-events: none;
        }

        .status-panel {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(100, 200, 255, 0.6);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            pointer-events: all;
        }

        .lung-display {
            width: 200px;
        }

        .lung-title {
            color: #00ffff;
            font-size: 14px;
            margin-bottom: 15px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .lung-visual {
            width: 100%;
            height: 150px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #00ffff;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }

        .lung-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(to top,
                rgba(100, 255, 100, 0.8) 0%,
                rgba(150, 255, 150, 0.6) 50%,
                rgba(200, 255, 200, 0.4) 100%);
            transition: height 0.3s ease-out;
            border-radius: 0 0 8px 8px;
        }

        .lung-fill.exhaling {
            background: linear-gradient(to top,
                rgba(100, 100, 255, 0.8) 0%,
                rgba(150, 150, 255, 0.6) 50%,
                rgba(200, 200, 255, 0.4) 100%);
        }

        .capacity-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            z-index: 1;
        }

        .breath-status {
            text-align: center;
            margin-top: 10px;
            font-size: 12px;
            color: #00ffff;
            text-transform: uppercase;
        }

        .frequency-panel {
            width: 250px;
        }

        .freq-title {
            color: #ff6600;
            font-size: 14px;
            margin-bottom: 15px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .freq-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 12px;
        }

        .freq-label {
            color: #cccccc;
        }

        .freq-value {
            color: #ffff00;
            font-weight: bold;
        }

        .controls-container {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: center;
            z-index: 100;
        }

        .control-panel {
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(255, 100, 255, 0.6);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .control-title {
            color: #ff00ff;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .breath-rate-display {
            color: #ffff00;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .control-row {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .control-label {
            color: #cccccc;
            font-size: 12px;
            min-width: 120px;
        }

        .control-slider {
            width: 150px;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        .control-slider::-webkit-slider-thumb {
            appearance: none;
            width: 16px;
            height: 16px;
            background: #ff00ff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.6);
        }

        .btn {
            background: linear-gradient(45deg, rgba(255, 0, 255, 0.3), rgba(100, 0, 255, 0.3));
            border: 1px solid #ff00ff;
            border-radius: 8px;
            color: white;
            padding: 10px 20px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 0, 255, 0.2);
        }

        .btn:hover {
            background: linear-gradient(45deg, rgba(255, 0, 255, 0.5), rgba(100, 0, 255, 0.5));
            box-shadow: 0 6px 20px rgba(255, 0, 255, 0.4);
            transform: translateY(-2px);
        }

        .btn.active {
            background: linear-gradient(45deg, rgba(255, 100, 0, 0.6), rgba(255, 200, 0, 0.6));
            border-color: #ff6600;
            box-shadow: 0 6px 20px rgba(255, 100, 0, 0.4);
        }

        .main-status {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -300px);
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            z-index: 100;
            text-shadow: 0 0 20px currentColor;
            transition: color 0.5s ease;
        }

        .status-inactive { color: #666; }
        .status-preparing { color: #ffff00; }
        .status-inhaling { color: #00ff00; }
        .status-exhaling { color: #0088ff; }
        .status-complete { color: #ff00ff; }

        @keyframes cosmicRotation {
            from { transform: rotateY(0deg) rotateX(0deg); }
            to { transform: rotateY(360deg) rotateX(360deg); }
        }

        @keyframes orbPulse {
            0%, 100% { 
                transform: translate(-50%, -50%) scale(1);
                box-shadow: 0 0 60px rgba(255, 255, 255, 0.8),
                           0 0 120px rgba(255, 200, 100, 0.6),
                           0 0 180px rgba(100, 200, 255, 0.4);
            }
            50% { 
                transform: translate(-50%, -50%) scale(1.1);
                box-shadow: 0 0 80px rgba(255, 255, 255, 1),
                           0 0 160px rgba(255, 200, 100, 0.8),
                           0 0 240px rgba(100, 200, 255, 0.6);
            }
        }

        @keyframes ringRotate1 {
            from { transform: rotateZ(0deg) rotateY(0deg); }
            to { transform: rotateZ(360deg) rotateY(180deg); }
        }

        @keyframes ringRotate2 {
            from { transform: rotateZ(0deg) rotateX(0deg); }
            to { transform: rotateZ(-360deg) rotateX(180deg); }
        }

        @keyframes ringRotate3 {
            from { transform: rotateX(0deg) rotateY(0deg); }
            to { transform: rotateX(360deg) rotateY(720deg); }
        }

        @keyframes geometryFloat {
            0%, 100% { transform: rotateZ(0deg) scale(1); }
            25% { transform: rotateZ(90deg) scale(1.1); }
            50% { transform: rotateZ(180deg) scale(1); }
            75% { transform: rotateZ(270deg) scale(0.9); }
        }

        @keyframes particleDrift {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translate(var(--drift-x), var(--drift-y)) scale(0.5);
                opacity: 0;
            }
        }

        .meditation-guide {
            position: fixed;
            top: 50%;
            right: 30px;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 20px;
            max-width: 200px;
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 100;
        }

        .meditation-guide.show {
            opacity: 1;
        }

        .guide-text {
            color: #cccccc;
            font-size: 12px;
            line-height: 1.6;
            text-align: center;
        }

        .guide-phase {
            color: #00ffff;
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="cosmic-background"></div>
    <div class="stars" id="stars"></div>
    
    <div class="main-container">
        <div class="sacred-core" id="sacredCore">
            <div class="central-orb"></div>
            <div class="breath-aura" id="breathAura"></div>
            
            <div class="sacred-rings">
                <div class="ring ring-1"></div>
                <div class="ring ring-2"></div>
                <div class="ring ring-3"></div>
            </div>
            
            <div class="geometry-layer" id="geometryLayer"></div>
            <div class="particle-field" id="particleField"></div>
        </div>
    </div>

    <div class="main-status" id="mainStatus">Sacred Breath Engine Ready</div>

    <div class="hud-container">
        <div class="status-panel lung-display">
            <div class="lung-title">Lung Capacity</div>
            <div class="lung-visual">
                <div class="lung-fill" id="lungFill"></div>
                <div class="capacity-text" id="capacityText">0%</div>
            </div>
            <div class="breath-status" id="breathStatus">Ready</div>
        </div>

        <div class="status-panel frequency-panel">
            <div class="freq-title">Sacred Frequencies</div>
            <div class="freq-item">
                <span class="freq-label">Schumann Resonance:</span>
                <span class="freq-value" id="freq1">7.83 Hz</span>
            </div>
            <div class="freq-item">
                <span class="freq-label">Golden Ratio:</span>
                <span class="freq-value" id="freq2">1.618 Hz</span>
            </div>
            <div class="freq-item">
                <span class="freq-label">Heart Coherence:</span>
                <span class="freq-value" id="freq3">0.10 Hz</span>
            </div>
            <div class="freq-item">
                <span class="freq-label">Breath Harmony:</span>
                <span class="freq-value" id="freq4">432 Hz</span>
            </div>
        </div>
    </div>

    <div class="controls-container">
        <div class="control-panel">
            <div class="control-title">Breath Control</div>
            <div class="breath-rate-display" id="breathRateDisplay">6 breaths/min</div>
            
            <div class="control-row">
                <label class="control-label">Breath Rate:</label>
                <input type="range" min="2" max="20" value="6" class="control-slider" id="breathRateSlider">
            </div>
            
            <div class="control-row">
                <button class="btn" id="breathToggle">Begin Session</button>
                <button class="btn" id="resetBtn">Reset</button>
            </div>
        </div>
    </div>

    <div class="meditation-guide" id="meditationGuide">
        <div class="guide-phase" id="guidePhase">Prepare</div>
        <div class="guide-text" id="guideText">
            Close your eyes and relax. Focus on your natural breath rhythm.
        </div>
    </div>

    <script>
        class SacredBreathEngine {
            constructor() {
                this.initializeElements();
                this.initializeState();
                this.createStarField();
                this.createGeometry();
                this.createParticles();
                this.setupEventListeners();
                this.animate();
            }

            initializeElements() {
                this.breathAura = document.getElementById('breathAura');
                this.lungFill = document.getElementById('lungFill');
                this.capacityText = document.getElementById('capacityText');
                this.breathStatus = document.getElementById('breathStatus');
                this.mainStatus = document.getElementById('mainStatus');
                this.breathToggle = document.getElementById('breathToggle');
                this.resetBtn = document.getElementById('resetBtn');
                this.breathRateSlider = document.getElementById('breathRateSlider');
                this.breathRateDisplay = document.getElementById('breathRateDisplay');
                this.meditationGuide = document.getElementById('meditationGuide');
                this.guidePhase = document.getElementById('guidePhase');
                this.guideText = document.getElementById('guideText');
                
                this.freqDisplays = [
                    document.getElementById('freq1'),
                    document.getElementById('freq2'),
                    document.getElementById('freq3'),
                    document.getElementById('freq4')
                ];
            }

            initializeState() {
                this.isActive = false;
                this.breathRate = 6; // breaths per minute
                this.cycleDuration = 60 / this.breathRate; // seconds
                this.currentPhase = 'ready'; // ready, inhale, hold, exhale, pause
                this.cycleStartTime = 0;
                this.lungCapacity = 0;
                this.animationFrame = 0;
                
                this.phaseTimings = {
                    inhale: 0.4,    // 40% of cycle
                    hold: 0.1,      // 10% of cycle  
                    exhale: 0.4,    // 40% of cycle
                    pause: 0.1      // 10% of cycle
                };

                this.meditationTexts = {
                    ready: "Close your eyes and relax. Focus on your natural breath rhythm.",
                    inhale: "Breathe in slowly and deeply through your nose. Feel the energy entering your body.",
                    hold: "Hold your breath gently. Feel the life force energy circulating.",
                    exhale: "Exhale slowly through your mouth. Release all tension and negativity.",
                    pause: "Rest in the stillness between breaths. Feel the peace within."
                };
            }

            createStarField() {
                const starsContainer = document.getElementById('stars');
                const starCount = 200;
                
                for (let i = 0; i < starCount; i++) {
                    const star = document.createElement('div');
                    star.className = 'star';
                    
                    const size = Math.random() * 2 + 1;
                    star.style.width = size + 'px';
                    star.style.height = size + 'px';
                    star.style.left = Math.random() * 100 + '%';
                    star.style.top = Math.random() * 100 + '%';
                    star.style.animationDelay = Math.random() * 3 + 's';
                    star.style.animationDuration = (2 + Math.random() * 4) + 's';
                    
                    starsContainer.appendChild(star);
                }
            }

            createGeometry() {
                const geometryLayer = document.getElementById('geometryLayer');
                const symbolCount = 12;
                
                for (let i = 0; i < symbolCount; i++) {
                    const symbol = document.createElement('div');
                    symbol.className = 'sacred-symbol';
                    
                    const angle = (i / symbolCount) * 360;
                    const radius = 150;
                    const x = 250 + Math.cos(angle * Math.PI / 180) * radius;
                    const y = 250 + Math.sin(angle * Math.PI / 180) * radius;
                    
                    symbol.style.left = x + 'px';
                    symbol.style.top = y + 'px';
                    symbol.style.transform = `rotate(${angle + 90}deg)`;
                    symbol.style.opacity = 0.6;
                    
                    geometryLayer.appendChild(symbol);
                }
            }

            createParticles() {
                const particleField = document.getElementById('particleField');
                const particleCount = 50;
                
                for (let i = 0; i < particleCount; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'energy-particle';
                    
                    const startX = Math.random() * 500;
                    const startY = Math.random() * 500;
                    const driftX = (Math.random() - 0.5) * 300;
                    const driftY = (Math.random() - 0.5) * 300;
                    
                    particle.style.left = startX + 'px';
                    particle.style.top = startY + 'px';
                    particle.style.setProperty('--drift-x', driftX + 'px');
                    particle.style.setProperty('--drift-y', driftY + 'px');
                    particle.style.animationDelay = Math.random() * 15 + 's';
                    particle.style.animationDuration = (10 + Math.random() * 10) + 's';
                    
                    const hue = Math.random() * 360;
                    particle.style.background = `hsl(${hue}, 80%, 70%)`;
                    particle.style.boxShadow = `0 0 6px hsl(${hue}, 80%, 70%)`;
                    
                    particleField.appendChild(particle);
                }
            }

            setupEventListeners() {
                this.breathToggle.addEventListener('click', () => {
                    this.toggleBreathing();
                });

                this.resetBtn.addEventListener('click', () => {
                    this.reset();
                });

                this.breathRateSlider.addEventListener('input', (e) => {
                    this.breathRate = parseInt(e.target.value);
                    this.cycleDuration = 60 / this.breathRate;
                    this.breathRateDisplay.textContent = `${this.breathRate} breaths/min`;
                });
            }

            toggleBreathing() {
                this.isActive = !this.isActive;
                
                if (this.isActive) {
                    this.startBreathingSession();
                } else {
                    this.stopBreathingSession();
                }
            }

            startBreathingSession() {
                this.cycleStartTime = Date.now();
                this.currentPhase = 'inhale';
                this.breathToggle.textContent = 'End Session';
                this.breathToggle.classList.add('active');
                this.breathAura.classList.add('active');
                this.meditationGuide.classList.add('show');
                this.updateMainStatus('Breathing Session Active', 'status-inhaling');
            }

            stopBreathingSession() {
                this.currentPhase = 'ready';
                this.breathToggle.textContent = 'Begin Session';
                this.breathToggle.classList.remove('active');
                this.breathAura.classList.remove('active', 'inhale', 'exhale');
                this.meditationGuide.classList.remove('show');
                this.lungCapacity = 0;
                this.updateMainStatus('Sacred Breath Engine Ready', 'status-inactive');
                this.updateLungDisplay();
            }

            reset() {
                this.stopBreathingSession();
                this.breathRate = 6;
                this.breathRateSlider.value = 6;
                this.breathRateDisplay.textContent = '6 breaths/min';
                this.cycleDuration = 10;
            }

            updateBreathCycle() {
                if (!this.isActive) return;

                const now = Date.now();
                const elapsed = (now - this.cycleStartTime) / 1000;
                const cycleProgress = (elapsed % this.cycleDuration) / this.cycleDuration;

                let newPhase = this.currentPhase;
                let capacity = 0;

                if (cycleProgress < this.phaseTimings.inhale) {
                    // Inhale phase
                    newPhase = 'inhale';
                    const inhaleProgress = cycleProgress / this.phaseTimings.inhale;
                    capacity = inhaleProgress * 100;
                } else if (cycleProgress < this.phaseTimings.inhale + this.phaseTimings.hold) {
                    // Hold phase
                    newPhase = 'hold';
                    capacity = 100;
                } else if (cycleProgress < this.phaseTimings.inhale + this.phaseTimings.hold + this.phaseTimings.exhale) {
                    // Exhale phase
                    newPhase = 'exhale';
                    const exhaleStart = this.phaseTimings.inhale + this.phaseTimings.hold;
                    const exhaleProgress = (cycleProgress - exhaleStart) / this.phaseTimings.exhale;
                    capacity = (1 - exhaleProgress) * 100;
                } else {
                    // Pause phase
                    newPhase = 'pause';
                    capacity = 0;
                }

                // Update phase if changed
                if (newPhase !== this.currentPhase) {
                    this.currentPhase = newPhase;
                    this.updateBreathVisuals();
                    this.updateMeditationGuide();
                }

                this.lungCapacity = Math.max(0, Math.min(100, capacity));
                this.updateLungDisplay();
            }

            updateBreathVisuals() {
                this.breathAura.classList.remove('inhale', 'exhale');
                
                switch (this.currentPhase) {
                    case 'inhale':
                    case 'hold':
                        this.breathAura.classList.add('inhale');
                        this.updateMainStatus('Inhaling - Draw in cosmic energy', 'status-inhaling');
                        break;
                    case 'exhale':
                    case 'pause':
                        this.breathAura.classList.add('exhale');
                        this.updateMainStatus('Exhaling - Release and let go', 'status-exhaling');
                        break;
                }
            }

            updateLungDisplay() {
                this.lungFill.style.height = this.lungCapacity + '%';
                this.capacityText.textContent = Math.round(this.lungCapacity) + '%';
                
                // Update lung fill color based on phase
                if (this.currentPhase === 'exhale' || this.currentPhase === 'pause') {
                    this.lungFill.classList.add('exhaling');
                } else {
                    this.lungFill.classList.remove('exhaling');
                }

                // Update breath status text
                const statusTexts = {
                    ready: 'Ready',
                    inhale: 'Inhaling',
                    hold: 'Holding',
                    exhale: 'Exhaling',
                    pause: 'Resting'
                };
                this.breathStatus.textContent = statusTexts[this.currentPhase] || 'Ready';
            }

            updateMeditationGuide() {
                const phaseNames = {
                    inhale: 'Breathe In',
                    hold: 'Hold',
                    exhale: 'Breathe Out',
                    pause: 'Rest',
                    ready: 'Prepare'
                };

                this.guidePhase.textContent = phaseNames[this.currentPhase] || 'Prepare';
                this.guideText.textContent = this.meditationTexts[this.currentPhase] || this.meditationTexts.ready;
            }

            updateMainStatus(text, className) {
                this.mainStatus.textContent = text;
                this.mainStatus.className = 'main-status ' + className;
            }

            updateFrequencies() {
                // Simulate dynamic frequency modulation based on breath state
                const baseFreqs = [7.83, 1.618, 0.10, 432];
                const modulation = Math.sin(this.animationFrame * 0.01) * 0.05;
                const breathMod = this.isActive ? (this.lungCapacity / 100) * 0.1 : 0;

                baseFreqs.forEach((freq, index) => {
                    const modulated = freq * (1 + modulation + breathMod);
                    let displayValue;
                    
                    if (freq < 10) {
                        displayValue = modulated.toFixed(3) + ' Hz';
                    } else {
                        displayValue = modulated.toFixed(1) + ' Hz';
                    }
                    
                    this.freqDisplays[index].textContent = displayValue;
                });

                // Update breath harmony frequency to match current breath rate
                const breathFreq = this.breathRate / 60; // Hz
                this.freqDisplays[2].textContent = breathFreq.toFixed(3) + ' Hz';
            }

            animate() {
                this.animationFrame++;
                
                this.updateBreathCycle();
                this.updateFrequencies();
                
                // Add subtle cosmic energy effects
                if (this.animationFrame % 60 === 0) {
                    this.addEnergyBurst();
                }

                requestAnimationFrame(() => this.animate());
            }

            addEnergyBurst() {
                if (!this.isActive) return;

                const sacredCore = document.getElementById('sacredCore');
                const burst = document.createElement('div');
                burst.style.position = 'absolute';
                burst.style.top = '50%';
                burst.style.left = '50%';
                burst.style.transform = 'translate(-50%, -50%)';
                burst.style.width = '10px';
                burst.style.height = '10px';
                burst.style.borderRadius = '50%';
                burst.style.background = `hsl(${Math.random() * 360}, 80%, 70%)`;
                burst.style.boxShadow = `0 0 20px currentColor`;
                burst.style.pointerEvents = 'none';
                burst.style.animation = 'energyBurst 2s ease-out forwards';
                
                sacredCore.appendChild(burst);

                // Add the animation keyframes dynamically
                if (!document.getElementById('energyBurstStyle')) {
                    const style = document.createElement('style');
                    style.id = 'energyBurstStyle';
                    style.textContent = `
                        @keyframes energyBurst {
                            0% {
                                transform: translate(-50%, -50%) scale(1);
                                opacity: 1;
                            }
                            100% {
                                transform: translate(-50%, -50%) scale(20);
                                opacity: 0;
                            }
                        }
                    `;
                    document.head.appendChild(style);
                }

                setTimeout(() => {
                    if (burst.parentNode) {
                        burst.parentNode.removeChild(burst);
                    }
                }, 2000);
            }
        }

        // Initialize the Sacred Breath Engine when page loads
        document.addEventListener('DOMContentLoaded', () => {
            const engine = new SacredBreathEngine();
            
            console.log('🌟 Sacred Breath Engine Initialized');
            console.log('🧘 Meditation guidance active');
            console.log('💫 Cosmic energy field generated');
            console.log('🌌 Sacred geometry patterns loaded');
            console.log('✨ Ready for transcendental breathing');
        });

        // Add some additional interactive features
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                document.getElementById('breathToggle').click();
            }
            if (e.code === 'KeyR') {
                e.preventDefault();
                document.getElementById('resetBtn').click();
            }
        });

        // Add mouse interaction for extra cosmic effects
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 20;
            const y = (e.clientY / window.innerHeight - 0.5) * 20;
            
            const sacredCore = document.getElementById('sacredCore');
            if (sacredCore) {
                sacredCore.style.transform = `translate(${x}px, ${y}px)`;
            }
        });
    </script>
</body>
</html>
