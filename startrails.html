<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fractal Luminary Viewer — Epoch Clock (Gleason Grid)</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000014;
      color: #e0e0e0;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }
    
    canvas {
      display: block;
    }

    /* Control buttons */
    .ui-panel {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 2;
    }

    .btn {
      padding: 8px 14px;
      font-size: 12px;
      border-radius: 18px;
      border: 1px solid #099;
      background: rgba(0, 153, 153, 0.15);
      color: #0ff;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: 0.25s;
    }
    
    .btn:hover {
      background: rgba(0, 153, 153, 0.25);
    }
    
    .btn:active {
      transform: translateY(1px);
    }
    
    .speed-label {
      display: inline-block;
      min-width: 48px;
      text-align: center;
      color: #0ff;
      line-height: 2.5;
    }
    
    input[type=range] {
      accent-color: #0ff;
    }

    /* Legend (top-right) */
    #legend {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 3;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #0ff;
      font-size: 14px;
      line-height: 1.5;
      color: #0ff;
      font-family: monospace;
    }
    
    #legend span {
      display: block;
    }

    /* Propagation mode selector */
    .mode-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 3;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #0ff;
      color: #0ff;
      font-family: monospace;
      font-size: 12px;
    }

    .mode-panel select {
      background: rgba(0, 20, 20, 0.8);
      color: #0ff;
      border: 1px solid #099;
      border-radius: 4px;
      padding: 4px;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <!-- Propagation Mode Selector -->
  <div class="mode-panel">
    <div>Schumann Mode:</div>
    <select id="modeSelect">
      <option value="realistic">🌍 Realistic (21ms)</option>
      <option value="symbolic">⏱️ Symbolic (1s)</option>
      <option value="resonant">🌊 7.83Hz Resonant</option>
      <option value="original">📡 Original (2.5s)</option>
    </select>
    <div id="propagationInfo" style="margin-top: 8px; font-size: 10px; color: #99eeff;"></div>
  </div>

  <!-- Controls -->
  <div class="ui-panel">
    <button class="btn" id="pauseBtn">⏸ PAUSE</button>
    <span class="speed-label" id="speedVal">1×</span>
    <input id="speedSl" type="range" min="0.2" max="3" step="0.1" value="1">
    <button class="btn" id="trailBtn">✨ TRAILS ON</button>
  </div>

  <!-- Luminary counters -->
  <div id="legend">
    <span style="color:#ffd65c">● Sun — <span id="sunCnt">0</span></span>
    <span style="color:#e6e6fa">● Moon — <span id="moonCnt">0</span></span>
    <span style="color:#99eeff">● Venus — <span id="venusCnt">0</span></span>
    <span style="color:#ff6b4a">● Mars — <span id="marsCnt">0</span></span>
  </div>

<script>
/******************** BASIC SETUP *************************/
const cvs = document.getElementById('canvas');
const ctx = cvs.getContext('2d');
let W = cvs.width = innerWidth;
let H = cvs.height = innerHeight;
const CENTER = { x: W / 2, y: H / 2 };
const TAU = Math.PI * 2;
const DEG = Math.PI / 180;
let R = Math.min(W, H) / 2.0;

addEventListener('resize', () => {
  W = cvs.width = innerWidth;
  H = cvs.height = innerHeight;
  CENTER.x = W / 2;
  CENTER.y = H / 2;
  R = Math.min(W, H) / 2.0;
});

/******************** UI STATE ***************************/
let running = true;
let showTrails = true;
let speed = 1;
let time = 0;
let propagationMode = 'realistic';

document.getElementById('pauseBtn').onclick = () => {
  running = !running;
  document.getElementById('pauseBtn').textContent = running ? '⏸ PAUSE' : '▶ PLAY';
};

document.getElementById('speedSl').oninput = e => {
  speed = +e.target.value;
  document.getElementById('speedVal').textContent = speed.toFixed(1) + '×';
};

document.getElementById('trailBtn').onclick = () => {
  showTrails = !showTrails;
  document.getElementById('trailBtn').textContent = showTrails ? '✨ TRAILS ON' : '💤 TRAILS OFF';
  if (!showTrails) {
    luminaries.forEach(l => l.trail = []);
  }
};

document.getElementById('modeSelect').onchange = e => {
  propagationMode = e.target.value;
  updatePropagationInfo();
};

function updatePropagationInfo() {
  const info = document.getElementById('propagationInfo');
  const modes = {
    realistic: 'Center→Edge: ~21ms<br>Light speed propagation',
    symbolic: 'Center→Edge: 1 second<br>Sacred timing alignment',
    resonant: 'Center→Edge: ~128ms<br>7.83Hz Schumann cycle',
    original: 'Center→Edge: 2.5 seconds<br>Original placeholder'
  };
  info.innerHTML = modes[propagationMode] || '';
}

updatePropagationInfo();

/******************** LUMINARIES *************************/
function luminaryPath(
  angularSpeed,
  latOscillationMaxDeg,
  latOscillationPeriodDays,
  latOscillationPhase = 0,
  initialAngularPhase = 0,
  radialWobbleFreq = 0,
  radialWobbleOffset = 0,
  northOnly = false
) {
  return t => {
    let currentLat;
    if (northOnly) {
      currentLat = latOscillationMaxDeg * (0.5 + 0.5 * Math.sin(TAU * t / latOscillationPeriodDays + latOscillationPhase));
    } else {
      currentLat = latOscillationMaxDeg * Math.sin(TAU * t / latOscillationPeriodDays + latOscillationPhase);
    }

    let r = R * (90 - currentLat) / 180;

    if (radialWobbleFreq > 0) {
      r += r * 0.05 * Math.sin(t * radialWobbleFreq + radialWobbleOffset);
    }

    const angle = t * angularSpeed + initialAngularPhase;

    return {
      x: CENTER.x + r * Math.cos(angle),
      y: CENTER.y + r * Math.sin(angle)
    };
  };
}

const luminaries = [
  {
    n: 'Sun',
    c: '#ffd65c',
    sz: 8,
    glow: true,
    glowSize: 12,
    path: luminaryPath(
      TAU / 365,
      23.5,
      365,
      0,
      0,
      0.017,
      0
    ),
    trail: [],
    max: 500
  },
  {
    n: 'Moon',
    c: '#e6e6fa',
    sz: 5,
    glow: true,
    glowSize: 8,
    path: luminaryPath(
      TAU / 27.3,
      28.5,
      365,
      Math.PI / 3,
      Math.PI / 3,
      0.12,
      Math.PI / 3
    ),
    trail: [],
    max: 400
  },
  {
    n: 'Venus',
    c: '#99eeff',
    sz: 4,
    glow: true,
    glowSize: 7,
    path: luminaryPath(
      TAU / 225,
      23.5,
      225,
      Math.PI / 4,
      Math.PI / 4,
      0.05,
      Math.PI / 4,
      true
    ),
    trail: [],
    max: 350
  },
  {
    n: 'Mars',
    c: '#ff6b4a',
    sz: 4,
    glow: true,
    glowSize: 7,
    path: luminaryPath(
      TAU / 687,
      23.5,
      687,
      Math.PI / 5,
      Math.PI / 5,
      0.033,
      Math.PI / 5,
      true
    ),
    trail: [],
    max: 350
  },
  {
    n: 'Stars',
    c: '#8a8aff',
    sz: 1.5,
    trail: false,
    path: t => {
      const a = [];
      const m = 240;
      for (let i = 0; i < m; i++) {
        const ang = i * 1.5 + t * 0.03;
        const r = R * (0.92 + 0.04 * Math.sin(i * 0.09 + t * 0.001));
        a.push({
          x: CENTER.x + r * Math.cos(ang * DEG),
          y: CENTER.y + r * Math.sin(ang * DEG)
        });
      }
      return a;
    }
  }
];

/******************** ZODIAC + LONGITUDE *****************/
const zodiac = [];
for (let i = 0; i < 12; i++) {
  const ang = TAU * i / 12 + Math.PI / 2;
  zodiac.push({
    x: CENTER.x + R * Math.cos(ang),
    y: CENTER.y + R * Math.sin(ang),
    label: String.fromCharCode(9800 + i)
  });
}

const LONGITUDES = 24;

/******************** EPOCH COUNTERS *********************/
const counters = { Sun: 0, Moon: 0, Venus: 0, Mars: 0 };
const prevAngles = { Sun: 0, Moon: 0, Venus: 0, Mars: 0 };
const outIds = { Sun: 'sunCnt', Moon: 'moonCnt', Venus: 'venusCnt', Mars: 'marsCnt' };
const LIBRA = Math.PI / 2;

function getAngle(p) {
  return (Math.atan2(p.y - CENTER.y, p.x - CENTER.x) + TAU) % TAU;
}

function crossedTop(name, ang) {
  const x = (prevAngles[name] < LIBRA && ang >= LIBRA);
  prevAngles[name] = ang;
  return x;
}

function bump(name) {
  counters[name]++;
  document.getElementById(outIds[name]).textContent = counters[name];
}

/******************** GRID *******************************/
function grid() {
  // Equator bold
  ctx.strokeStyle = 'rgba(0, 255, 255, 0.2)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(CENTER.x, CENTER.y, R * 0.5, 0, TAU);
  ctx.stroke();

  // Longitude spokes
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
  ctx.lineWidth = 1;
  for (let j = 0; j < LONGITUDES; j++) {
    const ang = j * TAU / LONGITUDES;
    ctx.beginPath();
    ctx.moveTo(CENTER.x, CENTER.y);
    ctx.lineTo(CENTER.x + R * Math.cos(ang), CENTER.y + R * Math.sin(ang));
    ctx.stroke();
  }

  // Zodiac labels
  zodiac.forEach(z => {
    ctx.fillStyle = '#0ff';
    ctx.font = '14px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(z.label, z.x, z.y);
  });
}

/******************** SCHUMANN WAVES *************************/
function drawSchumannWaves() {
  // ⚡ ACCURATE PROPAGATION CALCULATION
  let wavePropSpeed;
  
  switch (propagationMode) {
    case 'realistic':
      // Real-world propagation based on 6371km radius and 300,000 km/s EM speed
      const EARTH_RADIUS_KM = 6371;
      const EM_SPEED_KM_S = 300_000;
      const FRAMES_PER_SECOND = 60;
      
      // Calculate real-time travel in seconds and convert to frame units
      const timeToEdgeSeconds = EARTH_RADIUS_KM / EM_SPEED_KM_S; // ~0.0212s
      const framesToEdge = timeToEdgeSeconds * FRAMES_PER_SECOND; // ≈1.27 frames
      
      wavePropSpeed = R / framesToEdge;
      break;
      
    case 'symbolic':
      // One second from center to edge (sacred timing)
      wavePropSpeed = R / 60; // 60 frames = 1s
      break;
      
    case 'resonant':
      // Match 7.83 Hz Schumann resonance frequency
      wavePropSpeed = R * 7.83 / 60; // One full cycle = 1/7.83s ≈ 128ms
      break;
      
    case 'original':
    default:
      // Original placeholder timing
      wavePropSpeed = R / 150;
      break;
  }

  const waveProgress = (time * speed * 0.1) % (R / wavePropSpeed);
  const numWavefronts = 6;
  const waveSpacing = R / numWavefronts;

  ctx.globalAlpha = 0.3;

  // Draw outbound waves
  for (let i = 0; i < numWavefronts; i++) {
    let r = (waveProgress * wavePropSpeed - i * waveSpacing) % R;
    if (r < 0) r += R;

    ctx.strokeStyle = 'rgb(0, 255, 255)';
    ctx.lineWidth = 1 + 2 * (1 - r / R);

    ctx.beginPath();
    ctx.arc(CENTER.x, CENTER.y, r, 0, TAU);
    ctx.stroke();
  }

  // Draw inbound waves
  for (let i = 0; i < numWavefronts; i++) {
    let r = R - ((waveProgress * wavePropSpeed - i * waveSpacing) % R);
    if (r > R) r -= R;

    ctx.strokeStyle = 'rgb(0, 255, 255)';
    ctx.lineWidth = 1 + 2 * (r / R);

    ctx.beginPath();
    ctx.arc(CENTER.x, CENTER.y, r, 0, TAU);
    ctx.stroke();
  }

  ctx.globalAlpha = 1.0;

  // Constructive Nodal Zones - frequency adjusted based on propagation mode
  const numNodalZones = 5;
  const nodalZoneSpacing = R / numNodalZones;
  
  // Adjust nodal zone pulsing based on propagation speed
  let nodalFreq = 0.05;
  if (propagationMode === 'realistic') nodalFreq = 0.5; // Faster pulsing for realistic mode
  else if (propagationMode === 'resonant') nodalFreq = 7.83 / 60; // Match Schumann frequency

  for (let i = 1; i <= numNodalZones; i++) {
    const nodalRadius = i * nodalZoneSpacing;
    const pulseStrength = 0.5 + 0.5 * Math.sin(time * speed * nodalFreq + i * Math.PI / numNodalZones);

    ctx.strokeStyle = `rgba(255, 255, 0, ${pulseStrength * 0.7})`;
    ctx.lineWidth = 2 + pulseStrength * 3;
    ctx.shadowBlur = pulseStrength * 10;
    ctx.shadowColor = `rgba(255, 255, 0, ${pulseStrength * 0.7})`;

    ctx.beginPath();
    ctx.arc(CENTER.x, CENTER.y, nodalRadius, 0, TAU);
    ctx.stroke();

    ctx.shadowBlur = 0;
  }
}

/******************** MAIN LOOP *************************/
function draw() {
  requestAnimationFrame(draw);
  if (running) time += speed;

  ctx.fillStyle = 'rgba(0, 0, 20, 0.2)';
  ctx.fillRect(0, 0, W, H);
  
  grid();
  drawSchumannWaves();

  luminaries.forEach(b => {
    if (b.n === 'Stars') {
      ctx.fillStyle = b.c;
      const stars = b.path(time);
      stars.forEach((p, i) => {
        const alpha = 0.6 + 0.4 * Math.sin(time * 0.05 + i * 0.1);
        ctx.globalAlpha = alpha;
        ctx.fillRect(p.x, p.y, b.sz, b.sz);
      });
      ctx.globalAlpha = 1.0;
      return;
    }

    const pos = b.path(time);
    const ang = getAngle(pos);

    if (crossedTop(b.n, ang)) bump(b.n);

    if (showTrails && b.trail !== false) {
      b.trail.push(pos);
      if (b.trail.length > b.max) b.trail.shift();

      ctx.lineWidth = 2;
      for (let i = 0; i < b.trail.length - 1; i++) {
        const p1 = b.trail[i];
        const p2 = b.trail[i + 1];
        const alpha = (i / b.trail.length) * 0.8 + 0.1;

        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.strokeStyle = b.c + Math.floor(alpha * 255).toString(16).padStart(2, '0');
        ctx.stroke();
      }
    }

    // Draw the luminary itself
    ctx.beginPath();
    ctx.fillStyle = b.c;
    if (b.glow) {
      ctx.shadowBlur = b.glowSize;
      ctx.shadowColor = b.c;
    }
    ctx.arc(pos.x, pos.y, b.sz, 0, TAU);
    ctx.fill();
    ctx.shadowBlur = 0;
  });
}

draw();
</script>
</body>
</html>
