<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fractal Luminary Viewer — Epoch Clock (Gleason Grid)</title>
  <style>
    html,body{margin:0;height:100%;background:#000014;color:#e0e0e0;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
    canvas{display:block}

    /* control buttons */
    .ui-panel{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
      display:flex;gap:10px;z-index:2}

    .btn{padding:8px 14px;font-size:12px;border-radius:18px;border:1px solid #099;
      background:rgba(0,153,153,.15);color:#0ff;cursor:pointer;backdrop-filter:blur(8px);transition:.25s}
    .btn:hover{background:rgba(0,153,153,.25)}
    .btn:active{transform:translateY(1px)}
    .speed-label{display:inline-block;min-width:48px;text-align:center}
    input[type=range]{accent-color:#0ff}

    /* legend (top-right) */
    #legend{position:absolute;top:20px;right:20px;z-index:3;
      background:rgba(0,0,0,.6);padding:10px;border-radius:8px;
      border:1px solid #0ff;font-size:14px;line-height:1.5;color:#0ff;
      font-family:monospace}
    #legend span{display:block}
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <!-- controls -->
  <div class="ui-panel">
    <button class="btn" id="pauseBtn">⏸ PAUSE</button>
    <span  class="speed-label" id="speedVal">1×</span>
    <input  id="speedSl" type="range" min="0.2" max="3" step="0.1" value="1">
    <button class="btn" id="trailBtn">✨ TRAILS ON</button>
  </div>

  <!-- luminary counters -->
  <div id="legend">
    <span style="color:#ffd65c">● Sun — <span id="sunCnt">0</span></span>
    <span style="color:#e6e6fa">● Moon — <span id="moonCnt">0</span></span>
    <span style="color:#99eeff">● Venus — <span id="venusCnt">0</span></span>
    <span style="color:#ff6b4a">● Mars — <span id="marsCnt">0</span></span>
  </div>

<script>
/******************** BASIC SETUP *************************/
const cvs = document.getElementById('canvas'), ctx = cvs.getContext('2d');
let W=cvs.width=innerWidth, H=cvs.height=innerHeight;
const CENTER={x:W/2,y:H/2}, TAU=Math.PI*2, DEG=Math.PI/180;
let R=Math.min(W,H)/2.0;
addEventListener('resize',()=>{W=cvs.width=innerWidth;H=cvs.height=innerHeight;
  CENTER.x=W/2;CENTER.y=H/2;R=Math.min(W,H)/2.0;});

/******************** UI STATE ***************************/
let running=true, showTrails=true, speed=1, time=0;
document.getElementById('pauseBtn').onclick=()=>{running=!running;
  pauseBtn.textContent=running?'⏸ PAUSE':'▶ PLAY';};
document.getElementById('speedSl').oninput=e=>{
  speed=+e.target.value; speedVal.textContent=speed.toFixed(1)+'×';};
document.getElementById('trailBtn').onclick=()=>{
  showTrails=!showTrails;
  trailBtn.textContent=showTrails?'✨ TRAILS ON':'💤 TRAILS OFF';
  if(!showTrails) luminaries.forEach(l=>l.trail=[]);
};

/******************** LUMINARIES *************************/
// New general path function based on latitudinal oscillation
function luminaryPath(
    angularSpeed,             // How fast it circles the center (e.g., TAU/365, TAU/27.3)
    latOscillationMaxDeg,     // Max degrees latitude deviation (amplitude)
    latOscillationPeriodDays, // Period for latitudinal swing (e.g., 365 days)
    latOscillationPhase = 0,  // Phase for latitudinal swing
    initialAngularPhase = 0,  // Starting angular position
    radialWobbleFreq = 0,     // Frequency for the "fractal" radial wobble
    radialWobbleOffset = 0,   // Offset for the "fractal" radial wobble
    northOnly = false         // If true, latitude oscillates between 0 and maxLatOscillation
) {
    return t => {
        let currentLat;
        if (northOnly) {
            // Oscillate latitude between 0 and latOscillationMaxDeg (always north)
            currentLat = latOscillationMaxDeg * (0.5 + 0.5 * Math.sin(TAU * t / latOscillationPeriodDays + latOscillationPhase));
        } else {
            // Oscillate latitude between -latOscillationMaxDeg and +latOscillationMaxDeg
            currentLat = latOscillationMaxDeg * Math.sin(TAU * t / latOscillationPeriodDays + latOscillationPhase);
        }

        // Convert latitude to base radius for the Gleason Grid: r = (90 - latitude) / 180 * R
        let r = R * (90 - currentLat) / 180;

        // Apply an additional small radial wobble (fractal component) on top of the latitude-derived radius
        if (radialWobbleFreq > 0) {
            r += r * 0.05 * Math.sin(t * radialWobbleFreq + radialWobbleOffset); // Wobble is 5% of current radius
        }

        // Calculate angular position
        const angle = t * angularSpeed + initialAngularPhase;

        return {
            x: CENTER.x + r * Math.cos(angle),
            y: CENTER.y + r * Math.sin(angle)
        };
    };
}


const luminaries=[
  {n:'Sun',  c:'#ffd65c',sz:8, glow:true, glowSize:12,
   // Sun: Oscillates between Cancer (23.5N) and Capricorn (23.5S) annually
   // Latitudinal range: R * 0.37 (at 23.5N) to R * 0.63 (at 23.5S)
   path:luminaryPath(
     TAU/365, // angularSpeed: circles once per 365 days
     23.5,    // latOscillationMaxDeg: oscillates between -23.5 and +23.5
     365,     // latOscillationPeriodDays: annual declination cycle
     0,       // latOscillationPhase
     0,       // initialAngularPhase (starts around vernal equinox)
     0.017,   // radialWobbleFreq (subtle fractal wobble)
     0        // radialWobbleOffset
   ),
   trail:[],max:500},

  {n:'Moon', c:'#e6e6fa',sz:5, glow:true, glowSize:8,
   // Moon: Oscillates between approx -28.5S and +28.5N (slightly wider than Sun for "more drift")
   // While lunar nodal cycle is ~18.6 years, for clock visualization, annual lat swing or lunar cycle for the 'drift' might be used.
   // Using annual lat oscillation for general declination mimic, with fractal wobble for unique 'drift'.
   path:luminaryPath(
     TAU/27.3, // angularSpeed: circles once per ~27.3 days (sidereal month)
     28.5,     // latOscillationMaxDeg: wider latitude oscillation
     365,      // latOscillationPeriodDays: general annual declination mimic
     Math.PI/3,// latOscillationPhase
     Math.PI/3,// initialAngularPhase
     0.12,     // radialWobbleFreq (higher freq for 'more drift')
     Math.PI/3 // radialWobbleOffset
   ),
   trail:[],max:400},

  {n:'Venus',c:'#99eeff',sz:4, glow:true, glowSize:7,
   // Venus: Stays north of equator (0 to 23.5N), within Sun's path.
   // Radial range: R * 0.5 (at 0 deg) to R * 0.37 (at 23.5N)
   path:luminaryPath(
     TAU/225, // angularSpeed: circles once per ~225 days (orbital period)
     23.5,    // latOscillationMaxDeg: max North latitude (Tropic of Cancer)
     225,     // latOscillationPeriodDays: using orbital period for latitudinal swing
     Math.PI/4,// latOscillationPhase
     Math.PI/4,// initialAngularPhase
     0.05,    // radialWobbleFreq
     Math.PI/4,// radialWobbleOffset
     true     // northOnly: true, ensures latitude stays between 0 and 23.5N
   ),
   trail:[],max:350},

  {n:'Mars', c:'#ff6b4a',sz:4, glow:true, glowSize:7,
   // Mars: Stays north of equator (0 to 23.5N), inside Sun's range.
   // Radial range: R * 0.5 (at 0 deg) to R * 0.37 (at 23.5N)
   path:luminaryPath(
     TAU/687, // angularSpeed: circles once per ~687 days (orbital period)
     23.5,    // latOscillationMaxDeg: max North latitude (Tropic of Cancer)
     687,     // latOscillationPeriodDays: using orbital period for latitudinal swing
     Math.PI/5,// latOscillationPhase
     Math.PI/5,// initialAngularPhase
     0.033,   // radialWobbleFreq
     Math.PI/5,// radialWobbleOffset
     true     // northOnly: true, ensures latitude stays between 0 and 23.5N
   ),
   trail:[],max:350},

  {n:'Stars',c:'#8a8aff',sz:1.5,trail:false,
   path:t=>{const a=[],m=240;for(let i=0;i<m;i++){const ang=i*1.5+t*.03;
      const r=R*(0.92+0.04*Math.sin(i*.09+t*.001));
      a.push({x:CENTER.x+r*Math.cos(ang*DEG), y:CENTER.y+r*Math.sin(ang*DEG)});}return a;}}
];

/******************** ZODIAC + LONGITUDE *****************/
const zodiac=[];for(let i=0;i<12;i++){
  const ang=TAU*i/12+Math.PI/2;
  zodiac.push({x:CENTER.x+R*Math.cos(ang),y:CENTER.y+R*Math.sin(ang),label:String.fromCharCode(9800+i)});
}

const LONGITUDES=24; // every 15°

/******************** EPOCH COUNTERS *********************/
const counters={Sun:0,Moon:0,Venus:0,Mars:0};
const prevAngles={Sun:0,Moon:0,Venus:0,Mars:0};
const outIds={Sun:'sunCnt',Moon:'moonCnt',Venus:'venusCnt',Mars:'marsCnt'};
const LIBRA=Math.PI/2; // top axis
function getAngle(p){return( Math.atan2(p.y-CENTER.y,p.x-CENTER.x)+TAU)%TAU;}
function crossedTop(name,ang){const x= (prevAngles[name] < LIBRA && ang >= LIBRA);prevAngles[name]=ang;return x;}
function bump(name){counters[name]++;document.getElementById(outIds[name]).textContent=counters[name];}

/******************** GRID *******************************/
function grid(){
  // latitude rings every 10° REMOVED, now represented by dynamic Schumann waves

  // equator bold - KEPT
  ctx.strokeStyle='rgba(0,255,255,.2)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(CENTER.x, CENTER.y, R * 0.5, 0, TAU); ctx.stroke();
  
  // longitude spokes - KEPT
  ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=1;
  for(let j=0;j<LONGITUDES;j++){
    const ang=j*TAU/LONGITUDES;
    ctx.beginPath();ctx.moveTo(CENTER.x,CENTER.y);
    ctx.lineTo(CENTER.x+R*Math.cos(ang),CENTER.y+R*Math.sin(ang));ctx.stroke();
  }
  // zodiac labels - KEPT
  zodiac.forEach(z=>{ctx.fillStyle='#0ff';ctx.font='14px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(z.label,z.x,z.y);});
}

/******************** SCHUMANN WAVES *************************/
function drawSchumannWaves() {
    // These parameters control the visual speed and density of the waves
    const wavePropSpeed = R / 150; // Speed of wave propagation across the "firmament"
    const waveProgress = (time * speed * 0.1) % (R / wavePropSpeed); // Scale time for wave animation
    const numWavefronts = 6; // How many wave crests are visible at once
    const waveSpacing = R / numWavefronts; // Approximate distance between wave crests

    ctx.globalAlpha = 0.3; // Base transparency for wave lines

    // Draw outbound waves (explodes spherically outward)
    for (let i = 0; i < numWavefronts; i++) {
        let r = (waveProgress * wavePropSpeed - i * waveSpacing) % R;
        if (r < 0) r += R; // Ensure positive radius

        ctx.strokeStyle = `rgb(0, 255, 255)`; // Cyan color for the waves
        ctx.lineWidth = 1 + 2 * (1 - r / R); // Thicker near center, thinner outwards
        
        ctx.beginPath();
        ctx.arc(CENTER.x, CENTER.y, r, 0, TAU);
        ctx.stroke();
    }

    // Draw inbound waves (reflects instantly back to the center)
    for (let i = 0; i < numWavefronts; i++) {
        let r = R - ((waveProgress * wavePropSpeed - i * waveSpacing) % R);
        if (r > R) r -= R; // Ensure within bounds (starts at R, moves in)

        ctx.strokeStyle = `rgb(0, 255, 255)`;
        ctx.lineWidth = 1 + 2 * (r / R); // Thicker near center, thinner near edge
        
        ctx.beginPath();
        ctx.arc(CENTER.x, CENTER.y, r, 0, TAU);
        ctx.stroke();
    }

    ctx.globalAlpha = 1.0; // Reset global alpha

    // Constructive Nodal Zones (Cymatic Ignition Nodes)
    const numNodalZones = 5; // Number of fixed constructive interference rings
    const nodalZoneSpacing = R / numNodalZones; // Spacing between nodes

    for (let i = 1; i <= numNodalZones; i++) {
        const nodalRadius = i * nodalZoneSpacing;

        // Pulsing intensity based on time to simulate "phase alignment" / "burst points"
        // Adjust 0.05 for speed of pulsation. 0.5 + 0.5 * ... makes it pulse between 0.5 and 1.0 intensity
        const pulseStrength = 0.5 + 0.5 * Math.sin(time * speed * 0.05 + i * Math.PI / numNodalZones); 

        ctx.strokeStyle = `rgba(255, 255, 0, ${pulseStrength * 0.7})`; // Yellowish for ignition, stronger alpha
        ctx.lineWidth = 2 + pulseStrength * 3; // Thicker when pulsing strongly
        ctx.shadowBlur = pulseStrength * 10; // Add glow effect when pulsing
        ctx.shadowColor = `rgba(255, 255, 0, ${pulseStrength * 0.7})`;
        
        ctx.beginPath();
        ctx.arc(CENTER.x, CENTER.y, nodalRadius, 0, TAU);
        ctx.stroke();

        ctx.shadowBlur = 0; // Reset shadow after drawing each node
    }
}


/******************** MAIN LOOP *************************/
function draw(){
  requestAnimationFrame(draw);
  if(running) time+=speed;

  ctx.fillStyle='rgba(0,0,20,.2)';ctx.fillRect(0,0,W,H);
  grid(); // Draw the foundational grid
  drawSchumannWaves(); // Draw the dynamic Schumann wave patterns

  luminaries.forEach(b=>{
    if (b.n === 'Stars') {
      ctx.fillStyle = b.c;
      const stars = b.path(time);
      stars.forEach((p, i) => {
        const alpha = 0.6 + 0.4 * Math.sin(time * 0.05 + i * 0.1);
        ctx.globalAlpha = alpha;
        ctx.fillRect(p.x, p.y, b.sz, b.sz);
      });
      ctx.globalAlpha = 1.0; // Reset globalAlpha after drawing stars
      return;
    }

    const pos = b.path(time);
    const ang = getAngle(pos);

    if (crossedTop(b.n, ang)) bump(b.n);

    if (showTrails) {
      b.trail.push(pos);
      if (b.trail.length > b.max) b.trail.shift();

      // Draw trail segments with fading alpha
      ctx.lineWidth = 2; // Fixed line width for the trail
      for (let i = 0; i < b.trail.length - 1; i++) {
        const p1 = b.trail[i];
        const p2 = b.trail[i+1];

        // Calculate alpha based on position in trail (older points fade out)
        // Alpha ranges from ~0.1 at the start of the trail to ~0.9 at the end
        const alpha = (i / b.trail.length) * 0.8 + 0.1; // Adjust coefficients for desired fade intensity

        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        
        // Convert alpha to a two-digit hex string and append to the color
        ctx.strokeStyle = b.c + Math.floor(alpha * 255).toString(16).padStart(2, '0');
        ctx.stroke();
      }
    }

    // Draw the luminary itself
    ctx.beginPath();
    ctx.fillStyle = b.c;
    if (b.glow) {
      ctx.shadowBlur = b.glowSize;
      ctx.shadowColor = b.c;
    }
    ctx.arc(pos.x, pos.y, b.sz, 0, TAU);
    ctx.fill();
    ctx.shadowBlur = 0; // Reset shadow blur after drawing each luminary
  });
}
draw();
</script>
</body>
</html>
